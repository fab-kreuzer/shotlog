spring:
  datasource:
    url: jdbc:postgresql://postgres_db:5432/shotlog_prod
    driver-class-name: org.postgresql.Driver
    username: shotlog
    password: shotlog

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  thymeleaf:
    cache: true
