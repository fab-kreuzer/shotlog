spring:
  datasource:
    url: jdbc:postgresql://postgres_db:5432/shotlog_prod
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  thymeleaf:
    cache: true