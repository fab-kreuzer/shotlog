spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/shotlog_prod
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  thymeleaf:
    cache: true