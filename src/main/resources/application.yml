spring:
  config:
    # Local, git-ignored secrets file (see secrets.example.yml); env vars still work as fallback.
    import: optional:file:./secrets.yml

  application:
    name: shotlog

  servlet:
    multipart:
      # Framework-level ceiling; the avatar endpoint enforces a tighter 2 MB limit
      # with a friendly message before this hard cap is reached.
      max-file-size: 5MB
      max-request-size: 5MB

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

shotlog:
  disag:
    # n8n webhook that decodes DISAG ShotsApp QR codes (see docs/disag-shotsapp-qr-webhook.md)
    webhook-url: ${DISAG_WEBHOOK_URL:https://n8n.fkreuzer.dev/webhook/disag-result}
    webhook-secret: ${DISAG_WEBHOOK_SECRET:}
