<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Modal</title>
</head>
<body>

<div th:fragment="sessionModalContent">
  <div class="modal fade" id="createSessionModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">

        <form th:action="@{/sessions/create}" method="post" id="createSessionForm">

          <!-- HEADER -->
          <div class="modal-header">
            <h5 class="modal-title">Neuen Schießabend erstellen</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <!-- BODY -->
          <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">

            <!-- SESSION DATA -->
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label">Datum</label>
                <input type="date" id="sessionDate" name="sessionDate" class="form-control" required>
              </div>

              <div class="col-md-4">
                <label class="form-label">Startzeit</label>
                <input type="time" id="sessionTime" name="sessionTime" class="form-control" required>
              </div>

              <div class="col-md-4">
                <label class="form-label">Ort</label>
                <select name="location" class="form-select" required>
                  <script>
                    fetch('/api/locations')
                            .then(response => response.json())
                            .then(data => {
                              const select = document.querySelector('select[name="location"]');
                              data.forEach(location => {
                                const option = document.createElement('option');
                                option.value = location.id;
                                option.textContent = location.club;
                                select.appendChild(option);
                              });
                            })
                            .catch(error => console.error('Error fetching locations:', error));
                  </script>
              </select>
              </div>

              <div class="col-md-4">
                <label class="form-label">Art des Schießens</label>
                <select name="sessionType" class="form-select" required>
                  <option value="TRAINING">Training</option>
                  <option value="COMPETITION">Wettkampf</option>
                </select>
              </div>

              <div class="col-md-4 d-flex align-items-end">
                <div class="form-check">
                  <input class="form-check-input"
                         type="checkbox"
                         name="decimalScoring"
                         value="true"
                         id="decimalScoring">
                  <label class="form-check-label" for="decimalScoring">Zehntelwertung</label>
                </div>
              </div>
            </div>

            <hr>

            <!-- SERIES -->
            <div id="seriesContainer">

              <!-- ONE SERIES TEMPLATE -->
              <div class="card mb-4 series-block">
                <div class="card-header">
                  <strong>Serie <span class="series-number">1</span></strong>
                  <input type="hidden" name="series[0].seriesNumber" value="1">
                  <div class="float-end">
                    <button type="button" class="btn btn-sm btn-outline-danger me-2 remove-series-btn" onclick="removeSeries(this)" title="Serie entfernen">
                      <i class="bi bi-trash"></i> Entfernen
                    </button>
                    <input class="form-check-input testShot"
                           type="checkbox"
                           th:name="'series[0].testShot'"
                           value="true">
                    <label class="form-check-label">Probe</label>
                    <input type="hidden" th:name="'_series[0].testShot'" value="on">
                  </div>
                </div>

                <div class="card-body">
                  <div class="row g-2">

                    <!-- SHOTS 1–10 -->
                    <div class="col-6 col-md-3"
                         th:each="i : ${#numbers.sequence(1,10)}">
                      <label class="form-label">Schuss [[${i}]]</label>

                      <input type="hidden"
                             th:name="'series[0].shots[' + (${i}-1) + '].shotNumber'"
                             th:value="${i}"/>

                      <input type="number"
                             step="0.1"
                             min="0"
                             max="10.9"
                             value="0"
                             class="form-control"
                             th:name="'series[0].shots[' + (${i}-1) + '].value'">

                    </div>

                  </div>
                </div>
              </div>

            </div>

            <!-- ADD SERIES BUTTON -->
            <button type="button" class="btn btn-outline-secondary"
                    id="addSeriesButton"
                    onclick="addSeries()">
              + Serie hinzufügen
            </button>

          </div>

          <!-- FOOTER -->
          <div class="modal-footer">
            <button type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
              Abbrechen
            </button>

            <button type="submit" class="btn btn-success">
              Speichern
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <script>

    let seriesIndex = 1;

    function removeSeries(button) {
      try {
        const seriesBlock = button.closest('.series-block');
        const container = document.getElementById('seriesContainer');
        const allSeries = container.querySelectorAll('.series-block');

        // Allow removing series even if it's the last one (sessions can have 0 series)
        if (seriesBlock) {
          container.removeChild(seriesBlock);

          // Update series numbers and indices for remaining series
          updateSeriesNumbers();
        }
      } catch (error) {
        console.error('Error removing series:', error);
      }
    }

    function updateSeriesNumbers() {
      try {
        const container = document.getElementById('seriesContainer');
        const seriesBlocks = container.querySelectorAll('.series-block');

        seriesBlocks.forEach((block, index) => {
          // Update series number display
          const seriesNumberElement = block.querySelector('.series-number');
          if (seriesNumberElement) {
            seriesNumberElement.innerText = index + 1;
          }

          // Update all input names and values
          block.querySelectorAll('input').forEach(input => {
            if (input.name) {
              input.name = input.name.replace(/series\[\d+\]/, `series[${index}]`);
            }
            if (input.getAttribute('th:name')) {
              input.setAttribute('th:name', input.getAttribute('th:name').replace(/series\[\d+\]/, `series[${index}]`));
            }
            // Update series number hidden input
            if (input.name && input.name.includes('.seriesNumber')) {
              input.value = index + 1;
            }
          });
        });

        // Update global series index
        seriesIndex = seriesBlocks.length;
      } catch (error) {
        console.error('Error updating series numbers:', error);
      }
    }

    function addSeries() {
      try {
        const container = document.getElementById('seriesContainer');
        if (!container) {
          console.error('Series container not found');
          return;
        }

        // If no series exist, create from template, otherwise clone the first series
        let template = container.querySelector('.series-block');
        if (!template) {
          // Create a new series from scratch if none exist
          createFirstSeries();
          return;
        }

        const clone = template.cloneNode(true);

        clone.querySelector(".testShot").checked = false;

        // Update series number
        const seriesNumberElement = clone.querySelector('.series-number');
        if (seriesNumberElement) {
          seriesNumberElement.innerText = seriesIndex + 1;
        }

        const seriesInput = clone.querySelector('input[name^="series"]');
        if (seriesInput) {
          seriesInput.value = seriesIndex + 1;
        }

        // Update all input names
        clone.querySelectorAll('input').forEach(input => {
          if (input.name) {
            input.name = input.name.replace(/series\[\d+\]/, `series[${seriesIndex}]`);
          }
          if (input.getAttribute('th:name')) {
            input.setAttribute('th:name', input.getAttribute('th:name').replace(/series\[\d+\]/, `series[${seriesIndex}]`));
          }
          if (input.type === 'number') {
            input.value = '0';
            input.required = false; // Make shots optional by default
          }
        });

        container.appendChild(clone);
        seriesIndex++;

        setTimeout(() => {
          clone.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 100);
      } catch (error) {
        console.error('Error adding series:', error);
      }
    }

    function createFirstSeries() {
      // This function creates the first series when none exist
      const container = document.getElementById('seriesContainer');

      // Create the series HTML structure
      const seriesHtml = `
        <div class="card mb-4 series-block">
          <div class="card-header">
            <strong>Serie <span class="series-number">1</span></strong>
            <input type="hidden" name="series[0].seriesNumber" value="1">
            <div class="float-end">
              <button type="button" class="btn btn-sm btn-outline-danger me-2 remove-series-btn" onclick="removeSeries(this)" title="Serie entfernen">
                <i class="bi bi-trash"></i> Entfernen
              </button>
              <input class="form-check-input testShot" type="checkbox" name="series[0].testShot" value="true">
              <label class="form-check-label">Probe</label>
              <input type="hidden" name="_series[0].testShot" value="on">
            </div>
          </div>
          <div class="card-body">
            <div class="row g-2">
              ${Array.from({length: 10}, (_, i) => `
                <div class="col-6 col-md-3">
                  <label class="form-label">Schuss ${i + 1}</label>
                  <input type="hidden" name="series[0].shots[${i}].shotNumber" value="${i + 1}"/>
                  <input type="number" step="0.1" min="0" max="10.9" value="0" class="form-control" name="series[0].shots[${i}].value">
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      container.innerHTML = seriesHtml;
      seriesIndex = 1;
    }

    // Make resetModal function globally accessible
    window.resetModal = function() {
      console.log('resetModal');
      try {
        // Reset form
        document.getElementById('createSessionForm').reset();

        // Re-enable all inputs that might have been disabled
        document.querySelectorAll('#seriesContainer input, #seriesContainer select, #seriesContainer textarea').forEach(input => {
          input.disabled = false;
        });

        // Reset shot values to 0 and make them optional
        document.querySelectorAll('input[type="number"]').forEach(input => {
          input.value = '0';
          input.required = false;
        });

        // Reset testShot checkbox in the first series
        const firstSeriesTestShot = document.querySelector('.series-block .testShot');
        if (firstSeriesTestShot) {
          firstSeriesTestShot.checked = false;
        }

        // Remove additional series
        const container = document.getElementById('seriesContainer');
        const seriesBlocks = container.querySelectorAll('.series-block');

        // Keep only the first series block and remove the rest
        for (let i = 1; i < seriesBlocks.length; i++) {
          container.removeChild(seriesBlocks[i]);
        }

        // Reset seriesIndex
        seriesIndex = 1;

        // Reset form action to create
        const form = document.getElementById('createSessionForm');
        form.action = '/sessions/create';

        // Reset modal title
        const modalTitle = document.querySelector('.modal-title');
        if (modalTitle) {
          modalTitle.textContent = 'Neuen Schießabend erstellen';
        }
      } catch (error) {
        console.error('Error resetting modal:', error);
      }
    }

    // Add event listener for modal close
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize shots as optional by default
      document.querySelectorAll('input[type="number"]').forEach(input => {
        input.required = false;
      });

      const modal = document.getElementById('createSessionModal');
      if (modal) {
        modal.addEventListener('show.bs.modal', function (event) {
          // Check if the button that triggered the modal has data-action="create"
          const button = event.relatedTarget;
          const isCreateAction = button && button.getAttribute('data-action') === 'create';

          if (isCreateAction) {
            // Reset the form first for new sessions
            resetModal();

            const form = document.getElementById('createSessionForm');
            form.action = '/sessions/create';

            const modalTitle = document.querySelector('.modal-title');
            if (modalTitle) {
              modalTitle.textContent = 'Neuen Schießabend erstellen';
            }
          }

          // Only set date and time for new sessions, not when editing existing ones
          const form = document.getElementById('createSessionForm');
          const isNewSession = form.action.endsWith('/sessions/create');

          if (isNewSession) {
            console.log('new session');
            const sessionInput = document.getElementById('sessionDate');
            if (sessionInput) {
              console.log(new Date().toISOString());
              sessionInput.value = new Date().toISOString().split('T')[0];
            }

            const sessionTimeInput = document.getElementById('sessionTime');
            if (sessionTimeInput) {
              const now = new Date();
              const hh = String(now.getHours()).padStart(2, '0');
              const mm = String(now.getMinutes()).padStart(2, '0');

              sessionTimeInput.value = `${hh}:${mm}`;
            }
          } else {
            console.log('edit session');
          }
        });
      }
    });
  </script>

</div>

</body>
</html>
