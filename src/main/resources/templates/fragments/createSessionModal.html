<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Modal</title>
</head>
<body>

<div th:fragment="sessionModalContent">
  <div class="modal fade" id="createSessionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">

        <form th:action="@{/sessions/create}" method="post" id="createSessionForm">

          <!-- HEADER -->
          <div class="modal-header">
            <h5 class="modal-title">Create New Session</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <!-- BODY -->
          <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">

            <!-- SESSION DATA -->
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label">Date</label>
                <input type="date" name="sessionDate" class="form-control" required>
              </div>

              <div class="col-md-4">
                <label class="form-label">Start Time</label>
                <input type="time" name="startTime" class="form-control" required>
              </div>

              <div class="col-md-4">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" required>
              </div>

              <div class="col-md-4">
                <label class="form-label">Session Type</label>
                <select name="sessionType" class="form-select" required>
                  <option value="TRAINING">Training</option>
                  <option value="COMPETITION">Wettkampf</option>
                </select>
              </div>

              <div class="col-md-4 d-flex align-items-end">
                <div class="form-check">
                  <input class="form-check-input"
                         type="checkbox"
                         name="decimalScoring"
                         value="true"
                         id="decimalScoring">
                  <label class="form-check-label" for="decimalScoring">
                    Decimal scoring (Zehntel)
                  </label>
                </div>
              </div>
            </div>

            <hr>

            <!-- SERIES -->
            <div id="seriesContainer">

              <!-- ONE SERIES TEMPLATE -->
              <div class="card mb-4 series-block">
                <div class="card-header">
                  <strong>Series <span class="series-number">1</span></strong>
                  <input type="hidden" name="series[0].seriesNumber" value="1">
                </div>

                <div class="card-body">
                  <div class="row g-2">

                    <!-- SHOTS 1–10 -->
                    <div class="col-6 col-md-3"
                         th:each="i : ${#numbers.sequence(1,10)}">
                      <label class="form-label">Shot [[${i}]]</label>

                      <input type="hidden"
                             th:name="'series[0].shots[' + (${i}-1) + '].shotNumber'"
                             th:value="${i}"/>

                      <input type="number"
                             step="0.1"
                             min="0"
                             max="10.9"
                             class="form-control"
                             th:name="'series[0].shots[' + (${i}-1) + '].value'"
                             required>
                    </div>

                  </div>
                </div>
              </div>

            </div>

            <!-- ADD SERIES BUTTON -->
            <button type="button" class="btn btn-outline-secondary"
                    onclick="addSeries()">
              + Add Series
            </button>

          </div>

          <!-- FOOTER -->
          <div class="modal-footer">
            <button type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="submit" class="btn btn-success">
              Save Session
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <script>
    let seriesIndex = 1;

    function addSeries() {
      try {
        const container = document.getElementById('seriesContainer');
        if (!container) {
          console.error('Series container not found');
          return;
        }

        const template = container.querySelector('.series-block');
        if (!template) {
          console.error('Series template not found');
          return;
        }

        const clone = template.cloneNode(true);

        // Update series number
        const seriesNumberElement = clone.querySelector('.series-number');
        if (seriesNumberElement) {
          seriesNumberElement.innerText = seriesIndex + 1;
        }

        const seriesInput = clone.querySelector('input[name^="series"]');
        if (seriesInput) {
          seriesInput.value = seriesIndex + 1;
        }

        // Update all input names
        clone.querySelectorAll('input').forEach(input => {
          input.name = input.name.replace('series[0]', `series[${seriesIndex}]`);
          if (input.type === 'number') input.value = '';
        });

        container.appendChild(clone);
        seriesIndex++;

        setTimeout(() => {
          clone.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 100);
      } catch (error) {
        console.error('Error adding series:', error);
      }
    }
  </script>

</div>

</body>
</html>
