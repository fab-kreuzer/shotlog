<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Kalender')}">
    <body>
        <div th:fragment="content">
            <h1>Kalender</h1>
            <div id="calender-div">
                <div id='calendar'></div>
            </div>

            <script>

                document.addEventListener('DOMContentLoaded', function() {
                    var calendarEl = document.getElementById('calendar');

                    function colorForSessionType(type) {
                        switch (type) {
                            case 'TRAINING':
                                return '#4caf50'; // green
                            case 'COMPETITION':
                                return '#f44336'; // red
                            default:
                                return '#9e9e9e'; // grey fallback
                        }
                    }

                    var calendar = new FullCalendar.Calendar(calendarEl, {
                        locale: 'de',
                        headerToolbar: {
                            left: 'today',
                            center: 'title',
                            right: 'prev,next'
                        },
                        firstDay: 1,
                        initialView: 'dayGridMonth',
                        buttonText: {
                            today: 'Heute'
                        },
                        eventSources: [
                            {
                                url: '/api/sessions',
                                method: 'GET',
                                success: function(sessions) {
                                    console.log(sessions);
                                    return sessions.map(session => ({
                                        id: session.id,
                                        title: `${session.formattedType} - ${session.series.length} Series`,
                                        start: `${session.sessionDate}T${session.sessionTime}`,
                                        color: colorForSessionType(session.sessionType),
                                        extendedProps: {
                                            decimalScoring: session.decimalScoring,
                                            formattedShotSum: session.formattedShotSum,
                                            sessionType: session.sessionType
                                        }
                                    }));
                                }
                            }
                        ]
                    });
                    calendar.render();
                });

            </script>
        </div>
    </body>
</html>
