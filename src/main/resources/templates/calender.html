<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Kalender')}">
    <body>
        <div th:fragment="content">
            <h1>Kalender</h1>
            <div id="calender-div">
                <div id='calendar'></div>
            </div>

            <!-- Create Session Modal -->
            <div th:replace="~{fragments/createSessionModal :: sessionModalContent}"></div>

            <script>

                document.addEventListener('DOMContentLoaded', function() {
                    var calendarEl = document.getElementById('calendar');

                    function colorForSessionType(type) {
                        switch (type) {
                            case 'TRAINING':
                                return '#4caf50'; // green
                            case 'COMPETITION':
                                return '#f44336'; // red
                            default:
                                return '#9e9e9e'; // grey fallback
                        }
                    }

                    var calendar = new FullCalendar.Calendar(calendarEl, {
                        locale: 'de',
                        headerToolbar: {
                            left: 'today',
                            center: 'title',
                            right: 'prev,next'
                        },
                        firstDay: 1,
                        initialView: 'dayGridMonth',
                        buttonText: {
                            today: 'Heute'
                        },
                        eventSources: [
                            {
                                url: '/api/sessions',
                                method: 'GET',
                                success: function(sessions) {
                                    console.log(sessions);
                                    return sessions.map(session => ({
                                        id: session.id,
                                        title: `${session.formattedType} - ${session.series.length} Series`,
                                        start: `${session.sessionDate}T${session.sessionTime}`,
                                        color: colorForSessionType(session.sessionType),
                                        extendedProps: {
                                            decimalScoring: session.decimalScoring,
                                            formattedShotSum: session.formattedShotSum,
                                            sessionType: session.sessionType
                                        }
                                    }));
                                }
                            }
                        ],
                        eventClick: function(info) {
                            // Get the session ID from the clicked event
                            const sessionId = info.event.id;

                            // Fetch the session data from the server
                            fetch(`/api/sessions/${sessionId}`)
                                .then(response => response.json())
                                .then(session => {
                                    // Open the modal
                                    const modal = new bootstrap.Modal(document.getElementById('createSessionModal'));

                                    // Reset the modal first
                                    window.resetModal();

                                    // Set the form action to update
                                    const form = document.getElementById('createSessionForm');
                                    form.action = `/sessions/update/${sessionId}`;

                                    // Set the modal title
                                    const modalTitle = document.querySelector('.modal-title');
                                    if (modalTitle) {
                                        modalTitle.textContent = 'Schießabend bearbeiten';
                                    }

                                    // Populate form fields with session data
                                    document.getElementById('sessionDate').value = session.sessionDate;
                                    document.getElementById('sessionTime').value = session.sessionTime;

                                    // Set location dropdown
                                    const locationSelect = document.querySelector('select[name="location"]');
                                    if (locationSelect) {
                                        for (let i = 0; i < locationSelect.options.length; i++) {
                                            if (locationSelect.options[i].value == session.location.id) {
                                                locationSelect.selectedIndex = i;
                                                break;
                                            }
                                        }
                                    }

                                    // Set session type
                                    const sessionTypeSelect = document.querySelector('select[name="sessionType"]');
                                    if (sessionTypeSelect) {
                                        for (let i = 0; i < sessionTypeSelect.options.length; i++) {
                                            if (sessionTypeSelect.options[i].value === session.sessionType) {
                                                sessionTypeSelect.selectedIndex = i;
                                                break;
                                            }
                                        }
                                    }

                                    // Set decimal scoring checkbox
                                    document.getElementById('decimalScoring').checked = session.decimalScoring;

                                    // Remove all series except the first template
                                    const container = document.getElementById('seriesContainer');
                                    const seriesBlocks = container.querySelectorAll('.series-block');
                                    for (let i = 1; i < seriesBlocks.length; i++) {
                                        container.removeChild(seriesBlocks[i]);
                                    }

                                    // Add series from the session data
                                    session.series.forEach((series, index) => {
                                        if (index > 0) {
                                            // Add a new series block for each series after the first one
                                            addSeries();
                                        }

                                        // Get the current series block
                                        const seriesBlock = container.querySelectorAll('.series-block')[index];

                                        // Set test shot checkbox
                                        const testShotCheckbox = seriesBlock.querySelector('.testShot');
                                        if (testShotCheckbox) {
                                            testShotCheckbox.checked = series.testShot;
                                        }

                                        // Set shot values
                                        series.shots.forEach((shot, shotIndex) => {
                                            const shotInput = seriesBlock.querySelector(`input[name="series[${index}].shots[${shotIndex}].value"]`);
                                            if (shotInput) {
                                                shotInput.value = shot.value;
                                            }
                                        });
                                    });

                                    // Show the modal
                                    modal.show();
                                })
                                .catch(error => console.error('Error fetching session:', error));
                        }
                    });
                    calendar.render();
                });

            </script>
        </div>
    </body>
</html>
