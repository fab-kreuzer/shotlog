<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden - Shotlog</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <main>
        <div class="login-container">
            <div class="login-header">
                <h1>Shotlog</h1>
                <h2>Anmeldung</h2>
            </div>

            <form th:action="@{/login}" method="post" class="login-form">
                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input id="username" name="username" class="form-control" required autofocus />
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input id="password" name="password" type="password" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-primary">Anmelden</button>
            </form>
        </div>
    </main>

    <!-- Include notification script -->
    <script th:src="@{/js/notifications.js}"></script>

    <script>
        // Check for error or logout parameters and show appropriate notifications
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);

            if (urlParams.has('error')) {
                showNotification('Ungültiger Benutzername oder Passwort.', 'error');
            }

            if (urlParams.has('logout')) {
                showNotification('Sie wurden erfolgreich abgemeldet.', 'success');
            }
        });
    </script>
</body>
</html>
