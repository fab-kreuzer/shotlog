<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Übersicht - ' + ${type.getType()})}">
<body>
<div th:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1 th:text="'Übersicht deiner ' + ${type.getType()} + '-Sessions'"></h1>
        <button type="button" data-bs-toggle="modal" data-bs-target="#createSessionModal">Neue Session anlegen</button>
    </div>

    <div th:replace="~{fragments/createSessionModal :: sessionModalContent}"></div>

    <div th:if="${!sessions.isEmpty()}">
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
            <div th:each="singleSession : ${sessions}" style="background-color: #f0f0f0; padding: 16px; border-radius: 8px;">
                <p th:text="'Ort: ' + ${singleSession.getLocation()}"></p>
                <p th:text="'Datum: ' + ${#temporals.format(singleSession.getSessionDate(), 'dd.MM.yyyy')} + ' ' + ${#temporals.format(singleSession.getSessionTime(), 'HH:mm')} + ' Uhr'"></p>
                <p th:text="'Summe: ' + (${singleSession.isDecimalScoring()} ? ${#numbers.formatDecimal(singleSession.getShotSum(), 2, 1)} : ${singleSession.getShotSum().intValue()})"></p>
                <button>Details</button>
            </div>
        </div>
    </div>
    <p th:text="${sessions.isEmpty() ? 'No sessions available' : ''}"></p>
</div></body>
</html>
