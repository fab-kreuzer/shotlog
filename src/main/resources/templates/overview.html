<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Übersicht - ' + ${type.getType()})}">
<body>
<div th:fragment="content">
    <div class="container-fluid p-0">
        <!-- Header with title and action button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 mb-0" th:text="'Übersicht deiner ' + ${type.getType()} + '-Sessions'"></h1>
            <button th:if="${!sessions.isEmpty()}" type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createSessionModal" data-action="create">
                <i class="bi bi-plus-circle me-2"></i>Neue Session anlegen
            </button>
        </div>

        <!-- Create Session Modal -->
        <div th:replace="~{fragments/createSessionModal :: sessionModalContent}"></div>

        <!-- Sessions Display -->
        <div th:if="${!sessions.isEmpty()}" class="mt-4">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <div th:each="singleSession : ${sessions}" class="col">
                    <div class="card h-100 shadow-sm session-card">
                        <div class="card-body position-relative">
                            <div class="session-actions position-absolute top-0 end-0 mt-2 me-2">
                                <button class="btn btn-sm btn-warning me-1" th:attr="data-session-id=${singleSession.getId()}" onclick="loadFormBySessionId(this.getAttribute('data-session-id'))" title="Bearbeiten">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" 
                                        th:attr="data-session-id=${singleSession.getId()}"
                                        onclick="deleteSession(this.getAttribute('data-session-id'))" 
                                        title="Löschen">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>

                            <h5 class="card-title mb-3" th:text="${singleSession.getTranslatedLocation()}"></h5>

                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-calendar-event text-muted me-2"></i>
                                <span th:text="${#temporals.format(singleSession.getSessionDate(), 'dd.MM.yyyy')}"></span>
                            </div>

                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-clock text-muted me-2"></i>
                                <span th:text="${#temporals.format(singleSession.getSessionTime(), 'HH:mm')} + ' Uhr'"></span>
                            </div>

                            <div class="d-flex align-items-center">
                                <i class="bi bi-bullseye text-muted me-2"></i>
                                <span class="fw-bold" th:text="'Summe: ' + ${singleSession.getFormattedShotSum()} + ' (' + ${singleSession.getFormattedShotSumOfTestShots()} + ')'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty state message -->
        <div th:if="${sessions.isEmpty()}" class="text-center mt-5 pt-5">
            <i class="bi bi-inbox fs-1 text-muted"></i>
            <p class="mt-3 text-muted">Keine Sessions verfügbar</p>
            <button type="button" class="btn btn-outline-success mt-3" data-bs-toggle="modal" data-bs-target="#createSessionModal" data-action="create">
                Erste Session anlegen
            </button>
        </div>

        <!-- Delete Session Script -->
        <script th:inline="javascript">
            function deleteSession(sessionId) {
                if (confirm('Sind Sie sicher, dass Sie diese Session mit allen zugehörigen Daten löschen möchten?')) {
                    fetch('/sessions/delete/' + sessionId, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    }).then(response => {
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            console.error(response);
                            alert('Fehler beim Löschen der Session!');
                        }
                    }).catch(error => {
                        console.error(error);
                        alert('Fehler beim Löschen der Session!')
                    });
                }
            }

            function loadFormBySessionId(sessionId) {
                fetch('/sessions/get/' + sessionId)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Session not found');
                        }
                        return response.json();
                    })
                    .then(session => {
                        // Reset the form first
                        resetModal();
                        // Set session data
                        console.log(session)
                        document.querySelector('input[name="sessionDate"]').value = session.sessionDate;
                        document.querySelector('input[name="sessionTime"]').value = session.sessionTime;
                        document.querySelector('select[name="enemy"]').value = session.enemy.id;
                        document.querySelector('select[name="sessionType"]').value = session.sessionType;
                        document.querySelector('input[name="decimalScoring"]').checked = session.decimalScoring;
                        document.querySelector('input[name="home"]').checked = session.home;

                        // Handle series
                        const seriesContainer = document.getElementById('seriesContainer');
                        const templateSeries = seriesContainer.querySelector('.series-block');

                        // Clear existing series
                        while (seriesContainer.firstChild) {
                            seriesContainer.removeChild(seriesContainer.firstChild);
                        }

                        // Add series from session data
                        session.series.forEach((series, index) => {
                            // Clone template for first series or create new for additional series
                            let seriesBlock;
                            if (index === 0) {
                                seriesBlock = templateSeries.cloneNode(true);
                            } else {
                                seriesBlock = templateSeries.cloneNode(true);
                                // Update series number and inputs for additional series
                                const seriesNumberElement = seriesBlock.querySelector('.series-number');
                                if (seriesNumberElement) {
                                    seriesNumberElement.innerText = index + 1;
                                }

                                seriesBlock.querySelectorAll('input').forEach(input => {
                                    if (input.name) {
                                        input.name = input.name.replace('series[0]', `series[${index}]`);
                                    }
                                });
                            }

                            // Set series data
                            seriesBlock.querySelector('input[name^="series"][name$="seriesNumber"]').value = series.seriesNumber;
                            seriesBlock.querySelector('.testShot').checked = series.testShot;

                            // Set shot values
                            series.shots.forEach((shot, shotIndex) => {
                                const shotInput = seriesBlock.querySelector(`input[name="series[${index}].shots[${shotIndex}].value"]`);
                                if (shotInput) {
                                    shotInput.value = shot.value;
                                }
                            });

                            seriesContainer.appendChild(seriesBlock);
                        });

                        // Update seriesIndex for addSeries function
                        seriesIndex = session.series.length;

                        // Update form action to edit instead of create
                        const form = document.getElementById('createSessionForm');
                        form.action = '/sessions/update/' + sessionId;

                        // Update modal title
                        document.querySelector('.modal-title').textContent = 'Schießabend bearbeiten';

                        // Open the modal
                        const modal = new bootstrap.Modal(document.getElementById('createSessionModal'));
                        modal.show();
                    })
                    .catch(error => {
                        console.error('Error loading session:', error);
                        alert('Fehler beim Laden der Session!');
                    });
            }
        </script>
    </div>
</div>
</body>
</html>
