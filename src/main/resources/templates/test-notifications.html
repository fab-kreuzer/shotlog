<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(title='Test Notifications')}">
<body>
<div th:fragment="content">
    <h1>Test Notifications</h1>
    <p>This page is for testing the notification stacking functionality.</p>

    <div class="button-group">
        <button onclick="showNotification('This is a success notification', 'success')">
            Show Success Notification
        </button>
        <button onclick="showNotification('This is an error notification', 'error')">
            Show Error Notification
        </button>
        <button onclick="showMultipleNotifications()">
            Show Multiple Notifications
        </button>
    </div>

    <script>
        // Function to show multiple notifications in sequence
        function showMultipleNotifications() {
            showNotification('First notification', 'success');
            
            setTimeout(() => {
                showNotification('Second notification', 'error');
            }, 300);
            
            setTimeout(() => {
                showNotification('Third notification', 'success');
            }, 600);
        }
    </script>
</div>
</body>
</html>
