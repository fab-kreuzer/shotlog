<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title)">
<head>
    <title th:text="${title} ?: 'Private Site'">Private Site</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/settings.css}">
    <link rel="stylesheet" th:href="@{/css/overview.css}">

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script th:src="@{/js/notifications.js}"></script>
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <a class="navbar-brand text-decoration-none" th:classappend="${currentPage != null && currentPage == '/dashboard'} ? 'active' : ''" href="/dashboard">ShotLog</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" th:classappend="${currentPage != null && currentPage == '/overview' && currentPageParam != null && currentPageParam == 'type' && currentPageValue != null && currentPageValue == 'training'} ? 'active' : ''" href="/overview?type=training">Training</a>
                    <a class="nav-link" th:classappend="${currentPage != null && currentPage == '/overview' && currentPageParam != null && currentPageParam == 'type' && currentPageValue != null && currentPageValue == 'competition'} ? 'active' : ''" href="/overview?type=competition">Wettkampf</a>
                    <a class="nav-link" th:classappend="${currentPage != null && currentPage == '/settings'} ? 'active' : ''" href="/settings">Einstellungen</a>
                </div>

                <div class="navbar-nav">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light">
                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</header>

<main>
    <!-- page content goes here -->
    <div th:replace="~{::content}"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
