<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title)">
<head>
    <title th:text="${title} ?: 'Private Site'">Private Site</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/settings.css}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script th:src="@{/js/notifications.js}"></script>
</head>
<body>

<header>
    <nav>
        <div class="nav-left">
            <a th:href="@{/dashboard}">Dashboard</a>
            <a th:href="@{/overview?type=training}">Training</a>
            <a th:href="@{/overview?type=competition}">Wettkampf</a>
        </div>
        <div class="nav-right">
            <a th:href="@{/settings}">Einstellungen</a>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button>Logout</button>
            </form>
        </div>
    </nav>
</header>

<main>
    <!-- page content goes here -->
    <div th:replace="~{::content}"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
