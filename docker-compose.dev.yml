services:
  postgres:
    image: postgres:15-alpine
    container_name: shotlog-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: shotlog_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shotlog-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shotlog_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: shotlog-app-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shotlog_dev
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shotlog-dev-network
    volumes:
      - ./src:/app/src:ro
      - ./target:/app/target

volumes:
  postgres_data:

networks:
  shotlog-dev-network:
    driver: bridge
